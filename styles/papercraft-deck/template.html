<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{subtitle}}">
<link rel="icon" href="data:,">
<title>{{title}}</title>
<style>
  :root {
    color-scheme: light;
    --kraft: #d7bf96; --kraft-deep: #b89662; --cream: #fff9e9; --cream-shadow: #eee1c5;
    --ink: #34291f; --muted: #6d5a47; --edge: #a8895c; --shadow: rgba(48, 34, 19, .28);
    --mint: #b8dfc8; --coral: #f1b5a6; --butter: #f5db8a; --sky: #b9d9ee; --lilac: #d7c4eb;
    --green: #28754f; --red: #ad402d; --ochre: #8b681d;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    color: var(--ink); font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; line-height: 1.5;
    background-color: var(--kraft);
    background-image: radial-gradient(circle at 18% 20%, rgba(255,255,255,.18) 0 2px, transparent 3px),
      radial-gradient(circle at 74% 64%, rgba(0,0,0,.06) 0 2px, transparent 3px),
      repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 6px);
    background-size: 90px 90px, 72px 72px, auto;
  }
  .hand { font-family: 'Segoe Print', 'Bradley Hand', 'Marker Felt', 'Comic Sans MS', cursive; }
  .app-shell { min-height: 100%; }
  .deck { height: 100dvh; overflow-y: auto; overscroll-behavior-y: contain; scroll-snap-type: y mandatory; scrollbar-color: var(--edge) transparent; }
  .slide { min-height: 100%; padding: clamp(24px, 5vw, 58px) clamp(16px, 5vw, 72px) 104px; display: grid; place-items: center; scroll-snap-align: start; scroll-snap-stop: always; }
  .paper-stack { position: relative; width: min(100%, 1060px); filter: drop-shadow(0 18px 20px var(--shadow)); }
  .paper-stack::before { content: ''; position: absolute; inset: 8px -8px -8px 8px; background: var(--cream-shadow); clip-path: polygon(0 0, 100% 0, 100% 97%, 94% 99%, 88% 97%, 81% 100%, 73% 97.5%, 65% 99.5%, 57% 97%, 48% 100%, 39% 97%, 31% 99.5%, 23% 97%, 15% 100%, 7% 97.5%, 0 99%); }
  .paper { position: relative; isolation: isolate; max-height: calc(100dvh - 134px); overflow: auto; padding: clamp(34px, 6vw, 76px); background: var(--cream); clip-path: polygon(0 0, 100% 0, 100% 97%, 94% 99%, 88% 97%, 81% 100%, 73% 97.5%, 65% 99.5%, 57% 97%, 48% 100%, 39% 97%, 31% 99.5%, 23% 97%, 15% 100%, 7% 97.5%, 0 99%); }
  .paper::before { content: ''; position: absolute; z-index: -1; inset: 14px; border: 2px dashed var(--edge); opacity: .4; pointer-events: none; }
  .washi { position: absolute; top: -1px; left: 50%; width: 140px; height: 30px; transform: translateX(-50%) rotate(-2deg); background: repeating-linear-gradient(115deg, var(--sky) 0 11px, rgba(255,255,255,.6) 11px 15px); opacity: .92; clip-path: polygon(3% 0, 97% 4%, 100% 50%, 96% 100%, 4% 96%, 0 50%); box-shadow: 0 3px 5px rgba(0,0,0,.14); }
  .eyebrow { margin: 0 0 12px; color: var(--muted); font: 700 .76rem/1.4 'Courier New', monospace; text-transform: uppercase; letter-spacing: .16em; }
  h1, h2, h3, p { overflow-wrap: anywhere; }
  h1, h2 { margin: 0 0 18px; line-height: 1.08; letter-spacing: -.025em; }
  h1 { max-width: 15ch; font-size: clamp(2.5rem, 7vw, 5.4rem); }
  h2 { font-size: clamp(1.9rem, 4.3vw, 3.4rem); }
  h3 { margin: 0 0 6px; font-size: .78rem; font-family: 'Courier New', monospace; letter-spacing: .12em; }
  .subtitle { max-width: 58ch; margin: 0; color: var(--muted); font-size: clamp(1.1rem, 2vw, 1.45rem); }
  .cover-meta, .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .cover-meta span, .chip { padding: 6px 13px; border: 1px dashed var(--edge); border-radius: 999px 999px 999px 4px; background: var(--butter); font-size: .9rem; }
  .cover-meta span:nth-child(2) { background: var(--mint); transform: rotate(1deg); }
  .cover-meta span:nth-child(3) { background: var(--lilac); transform: rotate(-1deg); }
  .note-copy { max-width: 68ch; font-size: clamp(1.05rem, 1.7vw, 1.28rem); line-height: 1.8; }
  .slide-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
  .stamp { flex: none; margin-top: 4px; padding: 3px 10px; border: 2px solid currentColor; border-radius: 5px; color: var(--ochre); font: 700 .72rem/1.5 'Courier New', monospace; text-transform: uppercase; letter-spacing: .1em; transform: rotate(4deg); }
  .stamp.done { color: var(--green); } .stamp.failed { color: var(--red); }
  .meta { margin: 0 0 22px; }
  .chip { padding: 2px 10px; background: var(--cream-shadow); color: var(--muted); font-size: .78rem; }
  .job-sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 30px; }
  .job-sections section { min-width: 0; padding-top: 10px; border-top: 1px solid var(--cream-shadow); }
  .job-sections p { margin: 0; overflow-wrap: anywhere; }
  .job-sections .risk { border-top-color: var(--coral); }
  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 28px 0 0; padding: 0; list-style: none; }
  .metrics li { min-height: 104px; padding: 15px; display: flex; flex-direction: column; justify-content: center; background: var(--butter); border-radius: 4px 14px 4px 12px; box-shadow: 3px 4px 0 var(--cream-shadow); }
  .metrics li:nth-child(2) { background: var(--mint); transform: rotate(.5deg); }
  .metrics li:nth-child(3) { background: var(--coral); transform: rotate(-.7deg); }
  .metrics li:nth-child(4) { background: var(--lilac); }
  .metrics li:nth-child(5) { background: var(--sky); transform: rotate(.6deg); }
  .metrics b { font-size: clamp(1.35rem, 2.8vw, 2.2rem); line-height: 1.15; }
  .metrics span { margin-top: 4px; font-size: .85rem; }
  .closing-copy { max-width: 60ch; font-size: clamp(1.08rem, 1.9vw, 1.35rem); }
  .controls { position: fixed; z-index: 5; right: 0; bottom: 0; left: 0; min-height: 72px; padding: 10px clamp(12px, 4vw, 44px); display: grid; grid-template-columns: 44px minmax(70px, 1fr) auto 44px; align-items: center; gap: 14px; background: color-mix(in srgb, var(--cream) 92%, transparent); border-top: 1px solid rgba(80, 58, 35, .2); backdrop-filter: blur(10px); }
  .controls button { width: 42px; height: 42px; border: 1px solid var(--edge); border-radius: 50%; color: var(--ink); background: var(--cream); cursor: pointer; font: 700 1.15rem Georgia, serif; }
  .controls button:hover:not(:disabled), .controls button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .controls button:disabled { opacity: .4; cursor: default; }
  .progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: var(--cream-shadow); }
  #progress { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width .2s ease-out; }
  #page-number { min-width: 58px; color: var(--muted); font: 700 .78rem 'Courier New', monospace; text-align: center; }
  .generated { position: fixed; top: 12px; right: 16px; z-index: 2; padding: 4px 9px; color: var(--muted); background: rgba(255,249,233,.75); border-radius: 999px; font: .68rem 'Courier New', monospace; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --kraft: #33271f; --kraft-deep: #251b15; --cream: #45372b; --cream-shadow: #382c23; --ink: #f4e8d4; --muted: #d0bda0; --edge: #a78b62; --shadow: rgba(0,0,0,.58); --mint: #365c48; --coral: #77473d; --butter: #75602d; --sky: #365368; --lilac: #59456f; --green: #8ed0a8; --red: #ef9b89; --ochre: #e2c979; }
    .generated { background: rgba(55,43,32,.82); }
    .controls { background: color-mix(in srgb, var(--cream) 92%, transparent); }
  }
  @media (max-width: 640px) {
    .slide { padding: 34px 14px 92px; }
    .paper { padding: 38px 25px 45px; max-height: calc(100dvh - 116px); }
    .paper-stack::before { inset: 6px -5px -6px 5px; }
    .washi { width: 112px; height: 25px; }
    .slide-heading { display: block; }
    .stamp { display: inline-block; margin: 0 0 12px; }
    .job-sections { grid-template-columns: 1fr; gap: 13px; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metrics li { min-height: 82px; padding: 11px; }
    .controls { grid-template-columns: 40px minmax(35px, 1fr) auto 40px; gap: 8px; min-height: 64px; padding: 8px 10px; }
    .controls button { width: 38px; height: 38px; }
    .generated { top: 7px; right: 9px; font-size: .6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
  @media print {
    @page { size: landscape; margin: 0; }
    html, body, .app-shell, .deck { width: 100%; height: auto; min-height: 0; overflow: visible; background: white; }
    .deck { display: block; scroll-snap-type: none; }
    .slide { width: 100%; height: 100vh; min-height: 0; padding: 0; display: grid; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    .paper-stack { width: 100%; height: 100%; max-width: none; filter: none; }
    .paper-stack::before { inset: 8px; }
    .paper { width: 100%; height: 100%; max-height: none; padding: 46px 58px; overflow: hidden; clip-path: none; }
    .controls, .generated { display: none; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <span class="generated">Colmena · {{generated}}</span>
  <main class="deck" id="deck" aria-label="Presentación: {{title}}">
<!--COLMENA:SLIDES-->
  </main>
  <nav class="controls" aria-label="Controles de presentación">
    <button type="button" id="previous" aria-label="Diapositiva anterior" disabled>←</button>
    <div class="progress-track" role="progressbar" aria-label="Progreso de la presentación" aria-valuemin="1" aria-valuemax="{{slides_count}}" aria-valuenow="1"><span id="progress"></span></div>
    <span id="page-number" aria-live="polite">1 / {{slides_count}}</span>
    <button type="button" id="next" aria-label="Diapositiva siguiente">→</button>
  </nav>
</div>
<script>
(() => {
  const deck = document.getElementById('deck');
  const slides = [...document.querySelectorAll('.slide')];
  const progress = document.getElementById('progress');
  const track = progress.parentElement;
  const pageNumber = document.getElementById('page-number');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let current = 0;

  function update() {
    current = Math.max(0, Math.min(slides.length - 1, Math.round(deck.scrollTop / Math.max(deck.clientHeight, 1))));
    progress.style.width = `${slides.length ? ((current + 1) / slides.length) * 100 : 0}%`;
    track.setAttribute('aria-valuenow', String(current + 1));
    pageNumber.textContent = `${current + 1} / ${slides.length}`;
    previous.disabled = current === 0;
    next.disabled = current >= slides.length - 1;
  }

  function go(index) {
    const target = Math.max(0, Math.min(slides.length - 1, index));
    slides[target]?.scrollIntoView({ behavior: reducedMotion.matches ? 'instant' : 'smooth', block: 'start' });
    current = target;
    update();
  }

  previous.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  deck.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(event.key)) { event.preventDefault(); go(current + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); go(current - 1); }
    else if (event.key === 'Home') { event.preventDefault(); go(0); }
    else if (event.key === 'End') { event.preventDefault(); go(slides.length - 1); }
  });
  update();
})();
</script>
</body>
</html>
