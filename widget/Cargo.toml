[package]
name = "colmena-widget"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "colmena_widget"
path = "src/lib.rs"

[[bin]]
name = "colmena-widget"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
